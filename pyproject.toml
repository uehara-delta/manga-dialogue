[project]
name = "manga-dialogue"
version = "0.1.0"
description = "Kindle 画面をキャプチャして漫画のセリフを文字起こしする個人用ツール"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "mss>=10.0",
    "pillow>=11.0",
    "pydantic>=2.0",
    "typer>=0.15",
    "pyobjc-framework-Quartz>=11.0; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=11.0; sys_platform == 'darwin'",
]

[project.scripts]
manga-dialogue = "manga_dialogue.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_dialogue"]
